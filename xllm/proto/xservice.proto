syntax = "proto3";

package xllm_service.proto;
option cc_generic_services = true;

import "disagg_pd.proto";
import "provider.proto";

message Empty {}

enum GenerationDeliveryCode {
  GENERATION_DELIVERY_CODE_UNSPECIFIED = 0;
  GENERATION_DELIVERY_CODE_ACCEPTED = 1;
  GENERATION_DELIVERY_CODE_INVALID_PAYLOAD = 2;
  GENERATION_DELIVERY_CODE_UNKNOWN_REQUEST = 3;
  GENERATION_DELIVERY_CODE_CLIENT_DISCONNECTED = 4;
  GENERATION_DELIVERY_CODE_REQUEST_CLOSED = 5;
  GENERATION_DELIVERY_CODE_INVALID_IDENTITY = 6;
  GENERATION_DELIVERY_CODE_INVALID_SEQUENCE = 7;
  GENERATION_DELIVERY_CODE_COMMIT_UNPROVEN = 8;
  GENERATION_DELIVERY_CODE_TERMINAL_UNPROVEN = 9;
  GENERATION_DELIVERY_CODE_AFFINITY_MISSING = 10;
}

message Status {
  bool ok = 1;
  // Present on Generations per-item responses. Other RPCs may use status_msg
  // to preserve a bounded remote rejection reason.
  optional GenerationDeliveryCode delivery_code = 2;
  string status_msg = 3;
  // Cache version the master already holds after PushKVEvents. The Engine
  // clears a recorded publish failure once this covers that failure version.
  optional uint64 kv_commit_version = 4;
}

message StatusCode {
  int32 status_code = 1;
}

enum InstanceType {
  DEFAULT = 0;
  PREFILL = 1;
  DECODE = 2;
  MIX = 3;
}

message InstanceMetaInfo {
  // http server address currently
  string name = 1;
  // rpc server address
  string rpc_address = 2;
  optional InstanceType type = 3;
  repeated uint64 cluster_ids = 4;
  int32 dp_size = 7;
  repeated string addrs = 8;
  repeated uint32 ports = 10;
  uint64 register_ts_ms = 12;
  int32 kv_split_size = 13;
  // Physical Ascend super-pod id. Empty means the instance does not participate
  // in cross super-node isolation (wildcard). Tag 15 is intentionally aligned
  // with xllm-service's InstanceMetaInfo.super_node_id so the two protos stay
  // wire-compatible; tag 14 is reserved to match the Coordinator's layout
  // (xllm-service occupies it with backend_type).
  string super_node_id = 15;
  // Which pages of each INDEX resource the instance writes under
  // XLLM_CP_INDEX_WRITE_MODE: 0 = unspecified (legacy instance that
  // predates the field; admission keeps the legacy behavior), 1 =
  // replicated (the default: every rank writes all stripes at their
  // natural rows), 2 = sharded (only the rank's own stripe, at the
  // group-first page). Consulted by plan_kv_split_widths: a sharded
  // source cannot serve an equal-width kv_split_size > 1 destination.
  // Tag 16 (not 14): tag 14 is reserved for wire-compat with the
  // Coordinator's backend_type, tag 15 carries super_node_id, so the
  // CP index write mode moves to 16 to keep both engine-internal KV-split
  // admission and the Coordinator wire contract intact.
  optional int32 cp_index_write_mode = 16;
}

message KvCacheEvent {
    repeated bytes stored_cache = 1;
    repeated bytes removed_cache = 2;
}

message LoadMetrics {
  uint64 waiting_requests_num = 1;
  // Legacy name: arithmetic mean of DP-local logical admission-cache usage
  // ratios, not a percentage or physical device-memory usage. Composite
  // managers count max(used) / min(total) across admission leaves, so a
  // DP-local ratio may exceed 1 when leaf occupancies diverge.
  // Used for service routing; unlike monitoring, not a DP maximum.
  float gpu_cache_usage_perc = 2;
}

message LatencyMetrics {
  int64 recent_max_ttft = 1;
  int64 recent_max_tbt = 2;
}

// XTensor mode info for heartbeat updates
message XTensorHeartbeatInfo {
  // Per-worker free physical pages (index = worker rank)
  repeated uint64 worker_free_phy_pages = 1;
  // Model weight segments in GlobalXTensor (key: model_id)
  // Ordered segments that concatenate to form the full model weights
  map<string, WeightSegmentList> model_weight_segments = 3;
}

// A single weight segment in GlobalXTensor
message WeightSegmentInfo {
  uint64 offset = 1;  // Byte offset from GlobalXTensor base
  uint64 size = 2;    // Segment size in bytes
}

// List of weight segments for a model
message WeightSegmentList {
  repeated WeightSegmentInfo segments = 1;
}

message HeartbeatRequest {
  string name = 1;
  KvCacheEvent cache_event = 2;
  LoadMetrics load_metrics = 3;
  LatencyMetrics latency_metrics = 4;
  XTensorHeartbeatInfo xtensor_info = 5;
  xllm.proto.EngineState engine_state = 7;
}

message InstanceID {
  string name = 1;
}

message InstanceIDs {
  repeated string names = 1;
}

service XllmRpcService {
  rpc GetInstanceInfo(InstanceID) returns (InstanceMetaInfo) {}
  rpc Heartbeat(HeartbeatRequest) returns (Status) {}
  rpc PushKVEvents(xllm.proto.KVEventBatch) returns (Status) {}
  rpc GetStaticDecodeList(InstanceID) returns (InstanceIDs) {}
  rpc GetStaticPrefillList(InstanceID) returns (InstanceIDs) {}
  // xllm service receive response from decode instance directly in disagg pd mode.
  // This can eliminate the cost brought by forwarding through prefill.
  rpc Generations(xllm.proto.DisaggStreamGenerations) returns (xllm.proto.StatusSet) {}
}
